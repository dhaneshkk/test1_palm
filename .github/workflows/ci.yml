name: ci
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: onnxruntime shared library (for load-dynamic)
        run: |
          pip install onnxruntime
          echo "ORT_DYLIB_PATH=$(python -c "import onnxruntime,os,glob;print(glob.glob(os.path.dirname(onnxruntime.__file__)+'/capi/libonnxruntime.so*')[0])")" >> "$GITHUB_ENV"
      - name: Regenerate reference fixtures on this runner
        # INT8 onnxruntime kernels differ across CPUs (VNNI vs AVX2) and ORT versions, so the
        # Rust-vs-Python model check must compare against Python run on the same machine.
        run: |
          pip install opencv-python-headless numpy
          BOX=$(python -c 'import json;print(",".join(map(str,json.load(open("tests/fixtures/meta.json"))["box"])))')
          python tools/make_fixtures.py tests/fixtures/gray.png "$BOX" tests/fixtures/test_model_int8.onnx tests/fixtures
      - run: cargo build --release --workspace          # includes web/ (Topcoat 0.12 needs Rust ≥ 1.99)
      - run: cargo test --release --workspace -- --nocapture
      - name: Topcoat asset bundle builds
        run: |
          cargo install topcoat-cli --version 0.12.1 --locked
          topcoat asset bundle -p palmid-web --release

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lean 4.31 (kernel-only, no Mathlib)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | bash -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          ~/.elan/bin/lean lean/PalmID.lean
          for t in absDiff_symm angDist_symm angDist_self angDist_le_three total_le accept_monotone min_accept closerRel_irrefl conformal_feasible conformal_tight step_bounded step_lipschitz run_le announce_needs_K_frames gate_cells swap_requires_calibrated training_requires_data no_skip_calibration collection_waits_for_training no_self_loops crop_contains_box crop_margin count_two_le stable_unique; do echo "#print axioms $t"; done > /tmp/ax.lean
          cat lean/PalmID.lean /tmp/ax.lean > /tmp/check.lean
          ~/.elan/bin/lean /tmp/check.lean | tee /tmp/axioms.txt
          ! grep -q sorryAx /tmp/axioms.txt
